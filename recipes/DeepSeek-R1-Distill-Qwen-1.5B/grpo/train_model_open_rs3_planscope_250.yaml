# PlanScope-GRPO 250-step recipe for OpenRS3.
# Uses explicit <plan>...</plan> scaffold and phase-weighted policy-gradient loss.
# Run directly, or keep max_steps higher and set TINA_STOP_AT_STEP=250 if you want
# the old scheduler horizon behavior.
model_post_train_dataset_name: open_rs3_planscope_250
model_post_train_type: grpo
rl_post_train_reward_funcs:
- format
- plan_format
- cosine
rl_post_train_reward_weights:
- 1.0
- 0.2
- 2.0
cosine_max_len: 3584


# Model configs from trl
model_name_or_path: DeepSeek-R1-Distill-Qwen-1.5B
attn_implementation: flash_attention_2
use_peft: true
lora_r: 32
lora_alpha: 128
lora_dropout: 0.05
lora_target_modules:
- q_proj
- k_proj
- v_proj
- o_proj
- down_proj
- up_proj
- gate_proj


# GRPO trainer configs from trl
use_plan_scaffold: true
plan_rl_weight: 1.0
execute_rl_weight: 0.25
answer_rl_weight: 1.0
plan_min_tokens: 8
plan_max_tokens: 128
use_advantage_aware_phase_weight: false
kl_all_tokens: true
token_loss_mask: full
bf16: true
use_vllm: true
vllm_device: cuda:0
vllm_gpu_memory_utilization: 0.4
vllm_max_model_len: 4608
gradient_accumulation_steps: 4
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
log_level: info
logging_first_step: true
logging_steps: 1
logging_strategy: steps
push_to_hub: false
hub_strategy: every_save
hub_private_repo: true
hub_model_id: upup-ashton-wang

learning_rate: 1.0e-06
lr_scheduler_type: cosine_with_min_lr
lr_scheduler_kwargs:
  min_lr_rate: 0.1
max_prompt_length: 512
max_completion_length: 3584
max_steps: 250
num_generations: 6
num_train_epochs: 1
overwrite_output_dir: true
per_device_train_batch_size: 6
report_to:
- wandb

save_strategy: steps
save_steps: 50
save_total_limit: 100

seed: 42
temperature: 0.7
warmup_ratio: 0.1
